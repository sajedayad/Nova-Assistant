# Nova auf Fly.io – App-Name wird beim ersten Deploy eingetragen
app = "APP_NAME"
primary_region = "fra"

[build]

[env]
  TZ = "Europe/Berlin"
  NOVA_DATA = "/data"
  PORT = "8080"

[[mounts]]
  source = "nova_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
